<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="t d">
  <title id="t">Void UI</title>
  <desc id="d">Void UI banner: a black hole with gray rings beside the title and tagline</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#101010"/>
      <stop offset="1" stop-color="#1b1b1b"/>
    </linearGradient>
    <radialGradient id="glow" cx="1250" cy="280" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3a3a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#262626" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8c8c8c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#e6e6e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1598" height="558" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1600" height="560" fill="url(#bg)"/>
    <rect width="1600" height="560" fill="url(#grid)"/>
    <rect width="1600" height="560" fill="url(#glow)"/>

    <!-- void -->
    <g transform="translate(1250 280)" fill="none">
      <circle r="250" stroke="#262626" stroke-width="1.5"/>
      <circle r="205" stroke="#313131" stroke-width="1.5"/>
      <circle r="160" stroke="#444444" stroke-width="1.5"/>
      <ellipse rx="215" ry="52" transform="rotate(-18)" stroke="url(#ring)" stroke-width="5"/>
      <ellipse rx="170" ry="38" transform="rotate(-18)" stroke="#8c8c8c" stroke-opacity="0.45" stroke-width="2"/>
      <circle r="92" fill="#000000" stroke="#6b6b6b" stroke-width="2"/>
      <circle r="92" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10"/>
    </g>

    <!-- text -->
    <text x="120" y="196" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="20" letter-spacing="6" fill="#8a8a8a">PROMPT TO INTERFACE</text>
    <text x="116" y="318" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="132" font-weight="800" letter-spacing="-3" fill="url(#title)">Void UI</text>
    <text x="120" y="388" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#a3a3a3">Describe an interface in plain words.</text>
    <text x="120" y="430" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#6f6f6f">Get a polished component back.</text>
    <text x="120" y="494" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" letter-spacing="2" fill="#5a5a5a">next.js  /  prisma  /  gemini</text>
  </g>
  <rect x="1" y="1" width="1598" height="558" rx="28" fill="none" stroke="#2e2e2e" stroke-width="2"/>
</svg>
